<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:,">
<title>My Bets Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--line:#262626;--gold:#e8b923;--txt:#f5f5f5;--muted:#a3a3a3;--red:#ff2d3a;--green:#22c55e;--surf:#141414;--surf2:#1c1c1c;--gb:#e8b92347}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 500px at 50% -200px,#e8b9231a,transparent),var(--bg);color:var(--txt);font:14px Inter,system-ui,sans-serif}
h1,h2{font-family:Oswald,sans-serif;margin:0;color:var(--gold);text-transform:uppercase}h1{letter-spacing:.08em}
h2{font-size:18px;margin:28px 0 10px;letter-spacing:.1em;font-weight:600;border-left:3px solid var(--gold);padding-left:10px}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
.top{background:linear-gradient(180deg,#0c0c0c,#050505);border-bottom:1px solid var(--gb);box-shadow:0 12px 40px #0000008c;position:relative;padding:18px 0}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,#e8b923,transparent)}
.muted{color:var(--muted);font-size:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.card,.chartbox{background:linear-gradient(180deg,#1c1c1c,#141414);border:1px solid var(--gb);border-radius:1rem;padding:14px;transition:transform .2s,box-shadow .2s}
.card:hover,.chartbox:hover{transform:translateY(-4px) scale(1.01);box-shadow:0 14px 36px #00000073,0 0 0 1px #e8b923}
.card .l{font:700 11px Inter;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.card .v{font:700 26px Oswald;margin-top:4px}.card.hero .v{font-size:34px}
.card .s{font-size:12px;color:var(--muted);margin-top:4px}
table{width:100%;border-collapse:collapse;background:var(--surf);border:1px solid var(--gb);border-radius:1rem;overflow:hidden;color:var(--txt)}
th,td{padding:7px 10px;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}
th{background:#0c0c0c;color:var(--gold);text-transform:uppercase;font:600 11px Inter;letter-spacing:.12em;border-bottom:1px solid var(--gold)}
td{border-bottom:1px solid #202020}tr:nth-child(even) td{background:#0c0c0c66}tr:hover td{background:#e8b92314}tr.ft td{font-weight:700;background:#0c0c0c;border-top:1px solid var(--gb)}
th.t,td.t{text-align:left!important}
.scroll{overflow-x:auto}.neg{color:var(--red)!important}.pos{color:var(--green)!important}
.chartbox{padding:16px 10px 10px 4px}.chartbox svg{width:100%;height:auto;display:block}.chartbox text{fill:#a3a3a3;font:11px Inter}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font:700 11px Inter;letter-spacing:.06em;text-transform:uppercase}
.badge.win{background:#22c55e22;color:var(--green)}.badge.loss{background:#ff2d3a22;color:var(--red)}
.note{color:var(--muted);font-size:13px;line-height:1.5;margin:16px 0 28px}
.cash{font-size:11px;color:var(--gold);margin-left:6px;font-weight:600}
.secnote{color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 10px}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.fx-in{opacity:0;animation:up .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes shim{0%{background-position:-200% 0}100%{background-position:200% 0}}
.shim{background:linear-gradient(90deg,#f5c518 0%,#fff3b0 45%,#e8b923 55%,#f5c518 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shim 3.5s linear infinite}
.shim.neg{background:none;-webkit-text-fill-color:var(--red);animation:none}
@media(prefers-reduced-motion:reduce){.fx-in{animation:none;opacity:1}.shim{animation:none}.card:hover,.chartbox:hover{transform:none}}
@media(max-width:600px){.wrap{padding:0 12px}.card .v{font-size:22px}.card.hero .v{font-size:28px}th,td{padding:7px 8px;font-size:13px}}
th.t,td.t{white-space:normal;max-width:220px}
@media(max-width:600px){
  .desk{display:none}
  th.t,td.t{max-width:130px}
  th,td{padding:6px 6px;font-size:12px}
}
</style>
</head>
<body>
<div class="top"><div class="wrap"><h1>My Bets Tracker</h1><div class="muted" id="sub">My half of the Chris bets plus my FanDuel Predicts slips</div></div></div>
<div class="wrap fx-in" id="app" style="padding-bottom:40px">
  <div class="cards" id="hero" style="margin-top:18px"></div>
  <h2>Chris bets (my half)</h2>
  <div class="secnote" id="chrisnote"></div>
  <div class="scroll" id="christable"></div>
  <h2>My FanDuel Predicts bets</h2>
  <div class="muted" style="margin-bottom:8px">Oldest first.</div>
  <div class="chartbox" id="chart"></div>
  <div class="scroll" id="fdtable" style="margin-top:12px"></div>
  <div class="note" id="notes"></div>
</div>
<script>
const usd = (n, sign=false) => {
  const v = Number(n)||0;
  const body = Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  if (sign) return (v<0?'−':v>0?'+':'') + '$' + body;
  return (v<0?'−$':'$') + body;
};
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const short = p => (p||'').split(',')[0].trim();
const MONTHS = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function dateKey(s){
  const m = String(s||'').trim().match(/^([A-Za-z]+)\s+(\d{1,2})(?:,?\s*(\d{4}))?/);
  if(!m) return 0;
  const mon = MONTHS[m[1].slice(0,3).toLowerCase()];
  if(mon==null) return 0;
  const year = m[3] ? +m[3] : 2026;
  return Date.UTC(year, mon, +m[2]);
}
function oldestFirst(arr){
  return (arr||[]).map((b,i)=>({b,i})).sort((a,c)=>dateKey(a.b.date)-dateKey(c.b.date)||a.i-c.i).map(x=>x.b);
}
const pct=(w,n)=>n?((w/n)*100).toFixed(1)+'%':'—';

function profitChart(el, bets, labelFn){
  const profits = bets.map(b=>b.paid-b.stake);
  const W=900, rowH=36, L=200, R=90, T=8, B=8;
  const H=T+B+rowH*bets.length;
  const barW=W-L-R;
  const maxPos=Math.max(0,...profits), maxNeg=Math.max(0,...profits.map(p=>-p));
  const span=maxPos+maxNeg || 1;
  const z2 = L + barW*(maxNeg/span);
  let g=`<rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/>`;
  bets.forEach((b,i)=>{
    const p=b.paid-b.stake;
    const y=T+i*rowH;
    const mid=y+rowH/2;
    const w=Math.abs(p)/span*barW;
    const x=p>=0?z2:z2-w;
    const color=p>=0?'#22c55e':'#ff2d3a';
    g+=`<text x="${L-10}" y="${mid+4}" text-anchor="end" fill="#d4d4d4" font-size="12" font-family="Inter">${esc(labelFn(b))}</text>`;
    g+=`<rect x="${z2}" y="${y+6}" width="1" height="${rowH-12}" fill="#262626"/>`;
    g+=`<rect x="${x}" y="${y+8}" width="${Math.max(w,p===0?0:2)}" height="${rowH-16}" rx="4" fill="${color}"><title>${esc(b.picks)}: ${usd(p,true)}</title></rect>`;
    g+=`<text x="${p>=0?x+w+6:z2+6}" y="${mid+4}" text-anchor="start" fill="${color}" font-size="12" font-weight="600" font-family="Inter">${usd(p,true)}</text>`;
  });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Profit per FanDuel bet">${g}</svg>`;
}

function resultBadge(b){
  const cls = b.result==='Win' ? 'win' : 'loss';
  return `<span class="badge ${cls}">${esc(b.result)}</span>`;
}

function render(D){
  const chris = oldestFirst(D.chris||[]);
  const fd = oldestFirst(D.fanduel||[]);
  const half = Number(D.chris_half)||0;
  const acctProfit = Number(D.chris_profit_total)|| (half*2);

  const fdStake = fd.reduce((s,b)=>s+b.stake,0);
  const fdPaid = fd.reduce((s,b)=>s+b.paid,0);
  const fdNet = fdPaid-fdStake;
  const fdWins = fd.filter(b=>b.result==='Win').length;
  const fdLosses = fd.filter(b=>b.result==='Loss').length;
  const fdGraded = fdWins+fdLosses;
  const totalProfit = half + fdNet;

  document.getElementById('sub').textContent =
    `Up ${usd(totalProfit)} · FanDuel ${usd(fdNet,true)} · Chris half ${usd(half)}`;

  document.getElementById('hero').innerHTML = [
    ['Total profit', usd(totalProfit,true), totalProfit>=0?'pos shim':'neg shim','hero', `Chris half + FanDuel net`],
    ['FanDuel net', usd(fdNet,true), fdNet>=0?'pos':'neg','', `${usd(fdPaid)} paid − ${usd(fdStake)} staked`],
    ['Chris half', usd(half),'pos','', `half of ${usd(acctProfit)} account profit`],
    ['Total staked (mine)', usd(fdStake),'','', 'my FanDuel Predicts stakes'],
    ['Record', `${fdWins}–${fdLosses}`,'','', `${fdWins} wins · ${fdLosses} loss${fdLosses===1?'':'es'} on FanDuel`],
    ['Win rate', pct(fdWins,fdGraded),'','', `${fdWins} of ${fdGraded} FanDuel bets`]
  ].map(([l,v,cls,hero,s])=>`<div class="card${hero?' hero':''}"><div class="l">${l}</div><div class="v ${cls}">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`).join('');

  document.getElementById('chrisnote').innerHTML =
    `My share is <b class="pos">${usd(half)}</b> — half of the ${usd(acctProfit)} account profit. The slip list is shown as lines only; its own totals can run lower and are not what the split uses. Oldest first.`;

  const cStaked = chris.reduce((s,b)=>s+b.stake,0);
  const cPaid = chris.reduce((s,b)=>s+b.paid,0);
  const cNet = cPaid-cStaked;
  const cGraded = chris.filter(b=>b.result!=='Fee');
  const cWins = cGraded.filter(b=>b.result==='Win').length;
  const cLosses = cGraded.length-cWins;
  const cRows = chris.map(b=>{
    const profit=b.paid-b.stake;
    const paidTxt = b.result==='Loss'
      ? `${usd(b.paid)}${b.toWin!=null?` <span class="muted">(to win ${usd(b.toWin)})</span>`:''}`
      : usd(b.paid);
    const picks=esc(b.picks)+(b.note?` <span class="cash">↗ ${esc(b.note)}</span>`:'');
    const wp = b.result==='Fee' ? '<span class="muted">—</span>' : ((b.stake?(b.paid/b.stake).toFixed(2):'—')+'×');
    return `<tr>
      <td class="t">${picks}</td>
      <td class="t">${esc(b.date)}</td>
      <td class="t desk">${esc(b.type||'')}</td>
      <td data-v="${b.stake}">${usd(b.stake)}</td>
      <td data-v="${b.paid}">${paidTxt}</td>
      <td class="${profit>=0?'pos':'neg'}" data-v="${profit}">${usd(profit,true)}</td>
      <td>${resultBadge(b)}</td>
      <td class="desk">${wp}</td>
    </tr>`;
  }).join('');
  const cFoot=`<tr class="ft">
    <td class="t">Logged slips (not the split)</td><td></td><td class="desk"></td>
    <td>${usd(cStaked)}</td><td>${usd(cPaid)}</td>
    <td class="${cNet>=0?'pos':'neg'}">${usd(cNet,true)}</td>
    <td>${cWins}–${cLosses}</td>
    <td class="desk"></td>
  </tr>
  <tr class="ft">
    <td class="t">My counted share</td><td></td><td class="desk"></td>
    <td></td><td></td>
    <td class="pos">${usd(half,true)}</td>
    <td>half of ${usd(acctProfit)}</td>
    <td class="desk"></td>
  </tr>`;
  document.getElementById('christable').innerHTML=`<table><thead><tr>
    <th class="t">Picks</th><th class="t">Date</th><th class="t desk">Type</th>
    <th>Stake</th><th>Paid</th><th>Profit</th><th>Result</th><th class="desk">Multiple</th>
  </tr></thead><tbody>${cRows}</tbody><tfoot>${cFoot}</tfoot></table>`;

  profitChart(document.getElementById('chart'), fd, b=>short(b.picks));

  const fRows = fd.map(b=>{
    const profit=b.paid-b.stake;
    const picks=esc(b.picks)+(b.note?` <span class="cash">↗ ${esc(b.note)}</span>`:'');
    return `<tr>
      <td class="t">${picks}</td>
      <td class="t">${esc(b.date)}</td>
      <td class="t desk">${b.matchup?esc(b.matchup):'<span class="muted">—</span>'}</td>
      <td class="desk">${esc(b.odds||'—')}</td>
      <td data-v="${b.stake}">${usd(b.stake)}</td>
      <td data-v="${b.paid}">${usd(b.paid)}</td>
      <td class="${profit>=0?'pos':'neg'}" data-v="${profit}">${usd(profit,true)}</td>
      <td>${resultBadge(b)}</td>
    </tr>`;
  }).join('');
  const fFoot=`<tr class="ft">
    <td class="t">Total</td><td></td><td class="desk"></td><td class="desk"></td>
    <td>${usd(fdStake)}</td><td>${usd(fdPaid)}</td>
    <td class="${fdNet>=0?'pos':'neg'}">${usd(fdNet,true)}</td>
    <td>${fdWins}–${fdLosses}</td>
  </tr>`;
  document.getElementById('fdtable').innerHTML=`<table><thead><tr>
    <th class="t">Pick</th><th class="t">Date</th><th class="t desk">Matchup</th><th class="desk">Odds</th>
    <th>Stake</th><th>Return</th><th>Profit</th><th>Result</th>
  </tr></thead><tbody>${fRows}</tbody><tfoot>${fFoot}</tfoot></table>`;

  document.getElementById('notes').innerHTML=(D.notes||[]).map(esc).join('<br>');
}

fetch('data.json',{cache:'no-store'})
  .then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})
  .then(render)
  .catch(e=>{document.getElementById('sub').textContent='Could not load bets: '+e;});
</script>
<!--SORTABLE-START--><script>
/* Shared sortable tables (Grok Bot trackers). Click any header: asc/desc toggle with ▲/▼.
   Works on dynamically rendered tables via event delegation. Totals (tfoot, .total/.ft/.tot rows,
   or first cell TOTAL/ALL-TIME/GRAND) stay pinned at bottom. Group-label rows (fewer cells / colspan)
   keep their members: sorting happens within each group. Uses td[data-v] when present.
   Skip: th with own onclick, th.nosort, or table[data-nosort]. */
(function(){
  if(window.__sortableShared)return;window.__sortableShared=1;
  var st=document.createElement('style');
  st.textContent='table:not([data-nosort]) th:not(.nosort){cursor:pointer;user-select:none}th .srt-ar{font-size:.8em;opacity:.85;margin-left:3px}';
  (document.head||document.documentElement).appendChild(st);
  var MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  function key(cell){
    if(!cell)return null;
    var raw=cell.dataset&&cell.dataset.v!=null?cell.dataset.v:cell.textContent;
    var s=String(raw).replace(/[▲▼]/g,'').trim();
    if(!s||s==='—'||s==='-'||s==='–'||/^n\/?a$/i.test(s))return null;
    var m;
    if((m=s.match(/^(\d{4})-(\d{2})(?:-(\d{2}))?/)))return {n:Date.UTC(+m[1],+m[2]-1,+(m[3]||1))};
    if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/))){var y=+m[3];if(y<100)y+=2000;return {n:Date.UTC(y,+m[1]-1,+m[2])};}
    if((m=s.match(/^([A-Za-z]{3})[a-z]*\.? (\d{1,2}),? (\d{4})$/))&&MON[m[1].toLowerCase()])return {n:Date.UTC(+m[3],MON[m[1].toLowerCase()]-1,+m[2])};
    if((m=s.match(/^([A-Za-z]{3})[a-z]* (\d{4})$/))&&MON[m[1].toLowerCase()])return {n:Date.UTC(+m[2],MON[m[1].toLowerCase()]-1,1)};
    if((m=s.match(/^Q([1-4]) (\d{4})$/i)))return {n:Date.UTC(+m[2],(+m[1]-1)*3,1)};
    var t=s.replace(/[$,%x×\s]|USD/gi,'').replace(/^\+/,'').replace(/[−–]/g,'-');
    var neg=/^\(.*\)$/.test(t);if(neg)t=t.slice(1,-1);
    var mult=1;if((m=t.match(/^(-?[\d.]+)([KMB])$/i))){t=m[1];mult={k:1e3,m:1e6,b:1e9}[m[2].toLowerCase()];}
    if(/^-?\d*\.?\d+$/.test(t))return {n:parseFloat(t)*mult*(neg?-1:1)};
    return {s:s.toLowerCase()};
  }
  function pinned(r){
    if(r.parentElement&&r.parentElement.tagName==='TFOOT')return true;
    if(/(^|\s)(total|totals|ft|tot|sum|grand|pinned)(\s|$)/i.test(r.className))return true;
    var c=r.cells[0];return !!c&&/^\s*(TOTAL|TOTALS|ALL-TIME|GRAND TOTAL)\b/i.test(c.textContent);
  }
  document.addEventListener('click',function(e){
    var th=e.target.closest&&e.target.closest('th');if(!th||th.onclick||th.classList.contains('nosort'))return;
    var tb=th.closest('table');if(!tb||tb.hasAttribute('data-nosort'))return;
    var hr=th.parentElement;if(hr.parentElement.tagName==='TFOOT')return;
    var ci=0;for(var k=0;k<hr.cells.length&&hr.cells[k]!==th;k++)ci+=hr.cells[k].colSpan||1;
    var ncol=0;for(k=0;k<hr.cells.length;k++)ncol+=hr.cells[k].colSpan||1;
    var dir=th.dataset.sdir==='asc'?'desc':'asc',m=dir==='asc'?1:-1;
    tb.querySelectorAll('th').forEach(function(x){delete x.dataset.sdir;var a=x.querySelector('.srt-ar');if(a)a.remove();});
    th.dataset.sdir=dir;var ar=document.createElement('span');ar.className='srt-ar';ar.textContent=dir==='asc'?'▲':'▼';th.appendChild(ar);
    var bodies=tb.tBodies.length?[].slice.call(tb.tBodies):[tb];
    bodies.forEach(function(body){
      var all=[].slice.call(body.rows).filter(function(r){return r!==hr&&!(r.cells.length&&r.cells[0].tagName==='TH'&&!r.querySelector('td'));});
      var pins=[],groups=[{head:null,rows:[]}];
      all.forEach(function(r){
        if(pinned(r)){pins.push(r);return;}
        var w=0;for(var j=0;j<r.cells.length;j++)w+=r.cells[j].colSpan||1;
        if(r.cells.length===1&&ncol>1)groups.push({head:r,rows:[]});else groups[groups.length-1].rows.push(r);
      });
      function cellAt(r){var x=0;for(var j=0;j<r.cells.length;j++){if(x===ci)return r.cells[j];x+=r.cells[j].colSpan||1;}return null;}
      groups.forEach(function(g){
        g.rows.sort(function(a,b){var A=key(cellAt(a)),B=key(cellAt(b));
          if(!A&&!B)return 0;if(!A)return 1;if(!B)return -1;
          if(A.n!=null&&B.n!=null)return (A.n-B.n)*m;
          return String(A.s!=null?A.s:A.n).localeCompare(String(B.s!=null?B.s:B.n),undefined,{numeric:true})*m;});
        if(g.head)body.appendChild(g.head);g.rows.forEach(function(r){body.appendChild(r);});
      });
      pins.forEach(function(r){body.appendChild(r);});
    });
  },false);
})();
/* Drag-and-drop column reorder (all tracker tables). Drag a header onto another to move the column.
   Order persists per page + table header set in localStorage. Skips tables with colspan headers or data-noreorder. */
(function(){
  if(window.__colReorder)return;window.__colReorder=1;
  var st=document.createElement('style');
  st.textContent='th.cr-over{box-shadow:inset 3px 0 0 #d4a017}th[draggable=true]{-webkit-user-drag:element}';
  (document.head||document.documentElement).appendChild(st);
  function lab(th){var c=th.cloneNode(true);c.querySelectorAll('.srt-ar,.rz').forEach(function(x){x.remove()});return c.textContent.trim();}
  function hrow(tb){var r=tb.tHead&&tb.tHead.rows.length?tb.tHead.rows[tb.tHead.rows.length-1]:tb.rows[0];return r&&r.querySelector('th')?r:null;}
  function ok(tb){if(!tb||tb.hasAttribute('data-noreorder'))return false;var h=hrow(tb);if(!h||h.cells.length<2)return false;
    for(var i=0;i<h.cells.length;i++)if((h.cells[i].colSpan||1)>1)return false;return true;}
  function labs(tb){var h=hrow(tb);return [].map.call(h.cells,function(c){if(!c.dataset.ck)c.dataset.ck=lab(c);return c.dataset.ck;});}
  function sk(tb){return 'colord:'+location.pathname+':'+labs(tb).slice().sort().join('|');}
  function move(tb,from,to){if(from===to)return;var n=hrow(tb).cells.length;
    [].forEach.call(tb.rows,function(r){if(r.cells.length!==n)return;var c=r.cells[from],ref=r.cells[to];
      if(from<to)r.insertBefore(c,ref.nextSibling);else r.insertBefore(c,ref);});}
  function save(tb){try{localStorage.setItem(sk(tb),JSON.stringify(labs(tb)))}catch(e){}}
  function apply(tb){if(tb.__crApplied===tb.rows.length+':'+labs(tb).join('|'))return;var o;try{o=JSON.parse(localStorage.getItem(sk(tb))||'null')}catch(e){}

      b.title='Put every box back in its original spot';b.onclick=resetLayout;document.body.appendChild(b);}
    if(b){var v=Object.keys(saved).length?'block':'none';if(b.style.display!==v)b.style.display=v;}}
  function resetLayout(){
    var cs=containers();saved={};store();
    cs.forEach(function(c){var list=items(c);if(list.length<2)return;var ck=ckey(c);if(orig[ck])arrange(c,ck,list,keys(list),orig[ck]);});
  }
  window.boxdragReset=resetLayout;
  function swap(a,b){var m=document.createComment('bxd');a.parentNode.insertBefore(m,a);b.parentNode.insertBefore(a,b);m.parentNode.replaceChild(b,m);}

  // ---- dragging (pointer events: mouse, pen, touch) ----
  document.addEventListener('pointerdown',function(e){
    var h=e.target.closest&&e.target.closest('.bxd-h');if(!h||e.button>0)return;
    var it=h.parentElement,c=it&&it.__bxdC;if(!c)return;
    e.preventDefault();e.stopPropagation();
    try{h.setPointerCapture(e.pointerId);}catch(x){}
    dragging={h:h,it:it,c:c,id:e.pointerId,x0:e.clientX+scrollX,y0:e.clientY+scrollY,cx:e.clientX,cy:e.clientY,on:false,tgt:null,raf:0};
  },true);
  function edge(){ if(!dragging||!dragging.on)return;var d=dragging,v=0,H=innerHeight,M=Math.min(80,H*.12);
    if(d.cy>=M&&d.cy<=H-M)d.armed=true;if(d.armed){if(d.cy<M)v=-Math.ceil((M-d.cy)/4);else if(d.cy>H-M)v=Math.ceil((d.cy-(H-M))/4);}
    if(v){scrollBy(0,v);move(d.cx,d.cy);}d.raf=requestAnimationFrame(edge);}
  function move(x,y){var d=dragging;d.cx=x;d.cy=y;
    d.it.style.transform='translate('+(x+scrollX-d.x0)+'px,'+(y+scrollY-d.y0)+'px)';
    var el=document.elementFromPoint(x,y),t=null;
    for(var a=el;a&&a!==document.body;a=a.parentElement){if(a.__bxdC===d.c&&a!==d.it&&a.parentElement===d.c){t=a;break;}}
    if(t!==d.tgt){if(d.tgt)d.tgt.classList.remove('bxd-tgt');d.tgt=t;if(t)t.classList.add('bxd-tgt');}}
  document.addEventListener('pointermove',function(e){var d=dragging;if(!d||e.pointerId!==d.id)return;e.preventDefault();
    if(!d.on){if(Math.abs(e.clientX+scrollX-d.x0)+Math.abs(e.clientY+scrollY-d.y0)<5)return;
      d.on=true;d.it.classList.add('bxd-src');document.body.classList.add('bxd-on');d.raf=requestAnimationFrame(edge);}
    move(e.clientX,e.clientY);},{capture:true,passive:false});
  function end(e,cancel){var d=dragging;if(!d||e.pointerId!==d.id)return;dragging=null;cancelAnimationFrame(d.raf);
    d.it.classList.remove('bxd-src');d.it.style.transform='';document.body.classList.remove('bxd-on');
    if(d.tgt)d.tgt.classList.remove('bxd-tgt');
    if(d.on&&!cancel&&d.tgt&&d.tgt.parentElement===d.c&&d.it.parentElement===d.c){
      swap(d.it,d.tgt);var list=items(d.c);saved[d.c.__bxdKey||ckey(d.c)]=keys(list);store();}
    later();}
  document.addEventListener('pointerup',function(e){end(e,false);},true);
  document.addEventListener('pointercancel',function(e){end(e,true);},true);
  document.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('.bxd-h')){e.preventDefault();e.stopPropagation();}},true);
  document.addEventListener('touchmove',function(e){if(dragging)e.preventDefault();},{passive:false});

  function start(){scan();new MutationObserver(function(ms){
      for(var i=0;i<ms.length;i++){var t=ms[i].target;if(t.id==='bxd-reset'||dragging)continue;var an=ms[i].addedNodes;if(!(t.classList&&(t.classList.contains('bxd-h')||t.classList.contains('bxd-c')))&&!(an.length===1&&(an[0].className==='bxd-h'||an[0].className==='bxd-c'))){later();return;}}
    }).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class','style','hidden']});
    addEventListener('resize',later);addEventListener('load',later);}
  if(document.body)start();else document.addEventListener('DOMContentLoaded',start);
})();

</script><!--BOXDRAG-END-->
</body>
